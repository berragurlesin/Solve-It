<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLVE IT</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden bg-[#09090b] text-white font-sans">

  <nav class="max-w-7xl w-full mx-auto p-6 flex justify-between items-center">
    <a href="#" class="flex items-center gap-2 hover:opacity-80 transition">
      <img src="assets/logoduz.png" alt="Solve It" class="nav-logo" />
    </a>

    <div id="navAuthArea" class="flex items-center gap-3">
      <button onclick="openAuthModal('signin')" class="text-sm text-slate-300 hover:text-white px-4 py-2 font-mono-ticket">Sign In</button>
      <button onclick="openAuthModal('signup')" class="text-sm bg-white text-black font-bold px-5 py-2 rounded-full hover:bg-slate-200 transition font-mono-ticket">Sign Up</button>
    </div>
  </nav>

  <header class="max-w-7xl w-full mx-auto px-4 py-10 text-center">
    <img src="assets/logo.png" alt="Solve It" class="hero-logo" />
    <p class="text-slate-400 text-lg max-w-lg mx-auto font-mono-ticket mb-8">
      WHERE PROBLEMS MEET SOLUTIONS.
    </p>

   <div class="flex flex-wrap justify-center items-center gap-2 mb-6">
      <button onclick="filterTickets('all')" class="text-xs font-mono-ticket font-bold px-4 py-2 rounded-full border border-slate-700 bg-slate-900 text-white hover:border-purple-500 transition">ALL TICKETS</button>
      <button onclick="filterTickets('urgent')" id="filterUrgent" class="filter-btn text-xs font-mono-ticket font-bold px-4 py-2 rounded-full bg-red-600 text-white hover:bg-red-500 transition shrink-0 filter-urgent">URGENT</button>
      <button onclick="filterTickets('most_voted')" id="filterMostVoted" class="text-xs font-mono-ticket font-bold px-4 py-2 rounded-full bg-[#d9fb60] text-black hover:bg-amber-300 transition">MOST VOTED</button>
      <button onclick="filterTickets('Education')" class="text-xs font-mono-ticket font-bold px-4 py-2 rounded-full bg-[#aacc96] text-black hover:opacity-90 transition">EDUCATION</button>
      <button onclick="filterTickets('Software')" class="text-xs font-mono-ticket font-bold px-4 py-2 rounded-full bg-[#2b4789] text-black hover:opacity-90 transition">SOFTWARE</button>
      <button onclick="filterTickets('Technology')" class="text-xs font-mono-ticket font-bold px-4 py-2 rounded-full bg-[#ff7bac] text-black hover:opacity-90 transition">TECHNOLOGY</button>
      <button onclick="filterTickets('Transportation')" class="text-xs font-mono-ticket font-bold px-4 py-2 rounded-full bg-[#efce7b] text-black hover:opacity-90 transition">TRANSPORTATION</button>
      <button onclick="filterTickets('Community')" class="text-xs font-mono-ticket font-bold px-4 py-2 rounded-full bg-[#ef6f3c] text-black hover:opacity-90 transition">COMMUNITY</button>
      <button onclick="filterTickets('Other')" class="text-xs font-mono-ticket font-bold px-4 py-2 rounded-full bg-[#52a5ce] text-black hover:opacity-90 transition">OTHER</button>
      <button onclick="filterTickets('resolved')" class="text-xs font-mono-ticket font-bold px-4 py-2 rounded-full bg-[#afab23] text-white hover:bg-emerald-500 transition">SOLVED TICKETS</button>
    </div>

    <div class="max-w-xl mx-auto relative">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input 
        type="text" 
        id="searchInput" 
        oninput="handleSearch()"
        placeholder="Search tickets..." 
        class="w-full bg-[#121215] border border-slate-800 text-white pl-11 pr-4 py-3 rounded-xl text-sm font-mono-ticket focus:outline-none focus:border-purple-500 transition placeholder-slate-500"
      >
    </div>
  </header>

  <main class="max-w-5xl w-full mx-auto px-4 mb-16">
    <div class="flex justify-between items-center mb-6">
      <span class="text-xs font-mono-ticket text-slate-500 tracking-wider">ALL PROBLEMS</span>
      <button onclick="openPostModal()" class="bg-[#a855f7] hover:bg-purple-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition uppercase font-mono-ticket">
        + New Ticket
      </button>
    </div>

    <div id="ticketGrid" class="grid gap-6 md:grid-cols-2"></div>
  </main>

  <div id="authModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-[#121215] border border-slate-700 w-full max-w-sm p-5 rounded-lg relative">
      <button onclick="closeAuthModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white">✕</button>
      
      <h2 id="authModalTitle" class="text-lg font-bold text-white mb-3 font-mono-ticket">SIGN IN</h2>
      <p id="authErrorMsg" class="hidden text-xs text-red-400 font-mono-ticket mb-3 bg-red-950/50 p-2 rounded border border-red-800"></p>
      
      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-mono-ticket text-slate-400 mb-1">USERNAME</label>
          <input type="text" id="authUsername" required maxlength="20" placeholder="e.g. dev_user" class="w-full bg-[#09090b] border border-slate-700 rounded p-2.5 text-white text-xs focus:outline-none focus:border-purple-500 font-mono-ticket">
        </div>

        <div>
          <label class="block text-xs font-mono-ticket text-slate-400 mb-1">PASSWORD</label>
          <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-[#09090b] border border-slate-700 rounded p-2.5 text-white text-xs focus:outline-none focus:border-purple-500 font-mono-ticket">
        </div>

        <button type="submit" id="authSubmitBtn" class="w-full bg-white text-black font-bold py-2.5 rounded text-xs hover:bg-slate-200 transition font-mono-ticket uppercase">
          CONTINUE
        </button>
      </form>

      <div class="mt-4 pt-3 border-t border-slate-800 text-center font-mono-ticket text-xs text-slate-400">
        <span id="authSwitchText">Don't have an account?</span>
        <button id="authSwitchBtn" type="button" onclick="switchAuthMode()" class="text-purple-400 underline font-bold ml-1">Sign Up</button>
      </div>
    </div>
  </div>

  <div id="postModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-[#121215] border border-slate-700 w-full max-w-lg p-5 rounded-lg relative">
      <button onclick="closePostModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white">✕</button>
      <h2 class="text-lg font-bold text-white mb-3 font-mono-ticket">ISSUE PROBLEM TICKET</h2>
      <form id="postForm" class="space-y-3">
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-mono-ticket text-slate-400">TICKET TITLE</label>
            <span id="titleCounter" class="text-[10px] font-mono-ticket text-slate-500">0/80</span>
          </div>
          <input type="text" id="ticketTitle" required maxlength="80" class="w-full bg-[#09090b] border border-slate-700 rounded p-2.5 text-white text-xs focus:outline-none focus:border-purple-500 font-mono-ticket">
        </div>
        
        <div>
          <label class="block text-xs font-mono-ticket text-slate-400 mb-1">CATEGORY</label>
          <select id="ticketCategory" class="w-full bg-[#09090b] border border-slate-700 rounded p-2.5 text-white text-xs focus:outline-none focus:border-purple-500 font-mono-ticket">
            <option value="Education">Education</option>
            <option value="Software">Software</option>
            <option value="Technology">Technology</option>
            <option value="Transportation">Transportation</option>
            <option value="Community">Community</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-mono-ticket text-slate-400 mb-1">ATTACH IMAGE (OPTIONAL)</label>
          <input type="file" id="ticketImage" accept="image/*" class="w-full bg-[#09090b] border border-slate-700 rounded p-2 text-xs text-white file:mr-3 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-mono-ticket file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 font-mono-ticket" />
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-mono-ticket text-slate-400">PROBLEM DESCRIPTION</label>
            <span id="descCounter" class="text-[10px] font-mono-ticket text-slate-500">0/500</span>
          </div>
          <textarea id="ticketDesc" rows="3" required maxlength="500" class="w-full bg-[#09090b] border border-slate-700 rounded p-2.5 text-white text-xs focus:outline-none focus:border-purple-500 font-mono-ticket"></textarea>
        </div>

        <div class="flex items-center gap-2 pt-1 pb-1">
          <input type="checkbox" id="ticketUrgent" class="w-4 h-4 accent-red-500 rounded cursor-pointer">
          <label for="ticketUrgent" class="text-xs font-mono-ticket text-red-400 font-bold cursor-pointer select-none">MARK AS URGENT ISSUE (Please check this box only in cases of true urgency)</label>
        </div>

        <button type="submit" class="w-full bg-white text-black font-bold py-2.5 rounded text-xs hover:bg-slate-200 transition font-mono-ticket">PRINT TICKET</button>
      </form>
    </div>
  </div>

  <div id="detailModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div id="detailCardContainer" class="w-full max-w-3xl"></div>
  </div>

  <div id="profileModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-[#121215] border border-slate-700 w-full max-w-xl p-5 rounded-lg relative max-h-[85vh] overflow-y-auto">
      <button onclick="closeProfileModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-base">✕</button>
      
      <div class="flex items-center gap-3 mb-5 pb-3 border-b border-slate-800">
        <div class="w-10 h-10 rounded-full bg-purple-600/30 border border-purple-500/50 flex items-center justify-center text-purple-300 font-bold text-lg font-mono-ticket">
          <span id="profileAvatar">U</span>
        </div>
        <div>
          <h2 id="profileUsername" class="text-lg font-bold text-white font-mono-ticket">@username</h2>
        </div>
      </div>

      <div class="flex gap-4 mb-3 border-b border-slate-800 pb-2">
        <button onclick="switchProfileTab('issues')" id="tabBtnIssues" class="text-xs font-mono-ticket font-bold text-purple-400 border-b-2 border-purple-500 pb-1">
          ISSUES CREATED (<span id="countIssues">0</span>)
        </button>
        <button onclick="switchProfileTab('solutions')" id="tabBtnSolutions" class="text-xs font-mono-ticket font-bold text-slate-400 hover:text-slate-200 pb-1">
          SOLUTIONS PROVIDED (<span id="countSolutions">0</span>)
        </button>
      </div>

      <div id="profileIssuesList" class="space-y-2"></div>
      <div id="profileSolutionsList" class="space-y-2 hidden"></div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
