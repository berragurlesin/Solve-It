<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLVE IT</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" id="mainStyle">
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden bg-[#11120d] text-white font-mono-ticket">

  <nav class="max-w-7xl w-full mx-auto p-6 flex justify-between items-center">
    <a href="#" class="flex items-center gap-2">
      <img src="assets/logoduz.png" alt="Solve It" class="nav-logo" />
    </a>

    <div id="navAuthArea" class="flex items-center gap-3">
      <button onclick="openAuthModal('signin')" class="text-base text-slate-300 px-4 py-2 font-mono-ticket nav-text-lg cursor-pointer">Sign In</button>
      <button onclick="openAuthModal('signup')" class="text-base text-white font-bold px-5 py-2 font-mono-ticket nav-text-lg cursor-pointer">Sign Up</button>
    </div>
  </nav>

  <div id="homeView">
    <header class="max-w-7xl w-full mx-auto px-4 py-10 text-center">
      <img src="assets/logo.png" alt="Solve It" class="hero-logo" />
      <p class="text-slate-400 text-xl max-w-lg mx-auto font-mono-ticket mb-8">
        WHERE PROBLEMS MEET SOLUTIONS.
      </p>

     <div class="flex flex-wrap justify-center items-center gap-2 mb-6">
        <button onclick="filterTickets('all')" class="draw-filter f-all">ALL TICKETS</button>
        <button onclick="filterTickets('urgent')" id="filterUrgent" class="draw-filter f-urgent">URGENT</button>
        <button onclick="filterTickets('most_voted')" id="filterMostVoted" class="draw-filter f-voted">MOST VOTED</button>
        <button onclick="filterTickets('Education')" class="draw-filter f-edu">EDUCATION</button>
        <button onclick="filterTickets('Software')" class="draw-filter f-soft">SOFTWARE</button>
        <button onclick="filterTickets('Technology')" class="draw-filter f-tech">TECHNOLOGY</button>
        <button onclick="filterTickets('Transportation')" class="draw-filter f-trans">TRANSPORTATION</button>
        <button onclick="filterTickets('Community')" class="draw-filter f-comm">COMMUNITY</button>
        <button onclick="filterTickets('Other')" class="draw-filter f-other">OTHER</button>
        <button onclick="filterTickets('resolved')" class="draw-filter f-solved">SOLVED TICKETS</button>
      </div>

      <div class="max-w-xl mx-auto draw-search">
        <input
          type="text"
          id="searchInput"
          oninput="handleSearch()"
          placeholder="Search tickets..."
          aria-label="Search tickets"
          class="draw-search-input"
        >
      </div>
    </header>

    <main class="max-w-5xl w-full mx-auto px-4 mb-16">
      <div class="flex justify-between items-center mb-6">
        <button onclick="openPostModal()" class="draw-newticket">+ New Ticket</button>
      </div>

      <div id="ticketGrid" class="grid gap-6 md:grid-cols-2"></div>
    </main>
  </div>

  <div id="ticketPageView" class="hidden max-w-5xl w-full mx-auto px-4 py-10 mb-16">
    <div id="ticketPageContainer"></div>
  </div>

  <div id="authModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="dm-wrap">
      <div class="dm dm--auth" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <button type="button" onclick="closeAuthModal()" class="dm-x" aria-label="Close"></button>
        <h2 id="authModalTitle" class="dm-title">SIGN IN</h2>
        <form id="authForm" onsubmit="handleAuthSubmit(event)">
          <label for="authUsername" class="dm-label a-lab-user">USERNAME</label>
          <input type="text" id="authUsername" required maxlength="20" placeholder="e.g. dev_user" class="dm-input a-user">
          <label for="authPassword" class="dm-label a-lab-pass">PASSWORD</label>
          <input type="password" id="authPassword" required placeholder="••••••••" class="dm-input a-pass">
          <button type="submit" id="authSubmitBtn" class="dm-btn a-submit">CONTINUE</button>
        </form>
      </div>
      <div class="dm-under font-mono-ticket">
        <p id="authErrorMsg" class="hidden text-sm text-red-400 mb-3 bg-red-950/50 p-2 rounded border border-red-800"></p>
      </div>
    </div>
  </div>

  <div id="postModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="dm dm--post" role="dialog" aria-modal="true" aria-labelledby="postModalTitle">
      <button type="button" onclick="closePostModal()" class="dm-x pm-x" aria-label="Close"></button>
      <h2 id="postModalTitle" class="dm-title pm-title">ISSUE PROBLEM TICKET</h2>
      <form id="postForm">
        <div class="pm-lab pm-lab-title"><label for="ticketTitle">TICKET TITLE</label><span id="titleCounter" class="hidden">0/80</span></div>
        <input type="text" id="ticketTitle" required maxlength="80" class="dm-input pm-title-in">

        <div class="pm-lab pm-lab-cat"><label for="ticketCategory">CATEGORY</label></div>
        <select id="ticketCategory" class="dm-input pm-select">
          <option value="Education">Education</option>
          <option value="Software">Software</option>
          <option value="Technology">Technology</option>
          <option value="Transportation">Transportation</option>
          <option value="Community">Community</option>
          <option value="Other">Other</option>
        </select>

        <div class="pm-lab pm-lab-img"><label for="ticketImage">ATTACH IMAGE (If you want)</label></div>
        <input type="file" id="ticketImage" accept="image/*" class="dm-input pm-file">

        <div class="pm-lab pm-lab-desc"><label for="ticketDesc">PROBLEM DESCRIPTION</label><span id="descCounter" class="hidden">0/500</span></div>
        <textarea id="ticketDesc" required maxlength="500" class="dm-input pm-desc"></textarea>

        <input type="checkbox" id="ticketUrgent" class="pm-check">
        <label for="ticketUrgent" class="pm-urgent">MARK AS URGENT ISSUE (Please check this box only in cases of true urgency)</label>

        <button type="submit" class="dm-btn pm-submit">PRINT TICKET</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('mainStyle').href = 'style.css?v=' + Date.now();
    var appScript = document.createElement('script');
    appScript.src = 'app.js?v=' + Date.now();
    document.body.appendChild(appScript);
  </script>
</body>
</html>
